<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
  </defs>
  
  <!-- Teléfono izquierdo -->
  <rect x="150" y="300" width="260" height="520" rx="30" fill="none" stroke="url(#greenGrad)" stroke-width="12"/>
  <rect x="180" y="360" width="200" height="400" rx="15" fill="url(#greenGrad)" opacity="0.2"/>
  <circle cx="280" cy="820" r="12" fill="url(#greenGrad)"/>
  
  <!-- Signo de igual -->
  <line x1="480" y1="450" x2="544" y2="450" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round"/>
  <line x1="480" y1="574" x2="544" y2="574" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Teléfono derecho -->
  <rect x="614" y="300" width="260" height="520" rx="30" fill="none" stroke="url(#greenGrad)" stroke-width="12"/>
  <rect x="644" y="360" width="200" height="400" rx="15" fill="url(#greenGrad)" opacity="0.2"/>
  <circle cx="744" cy="820" r="12" fill="url(#greenGrad)"/>
</svg>
