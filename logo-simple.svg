<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
  </defs>

  <!-- Teléfono izquierdo -->
  <rect x="20" y="50" width="50" height="100" rx="6" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
  <rect x="26" y="60" width="38" height="80" rx="3" fill="url(#greenGrad)" opacity="0.2"/>
  <circle cx="45" cy="155" r="2" fill="url(#greenGrad)"/>
  
  <!-- Signo de igual -->
  <line x1="80" y1="85" x2="120" y2="85" stroke="url(#greenGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="115" x2="120" y2="115" stroke="url(#greenGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Teléfono derecho -->
  <rect x="130" y="50" width="50" height="100" rx="6" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
  <rect x="136" y="60" width="38" height="80" rx="3" fill="url(#greenGrad)" opacity="0.2"/>
  <circle cx="155" cy="155" r="2" fill="url(#greenGrad)"/>
</svg>
