<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ChatP2P - Feature Graphic Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #00D26A;
            margin-bottom: 10px;
        }
        
        p {
            color: #888;
            margin-bottom: 20px;
        }
        
        /* Feature Graphic Canvas */
        #featureGraphic {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d1f15 100%);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative elements */
        .glow-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 210, 106, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .glow-1 { top: -100px; right: -50px; }
        .glow-2 { bottom: -150px; left: -100px; opacity: 0.5; }
        
        /* Content */
        .content {
            display: flex;
            align-items: center;
            gap: 60px;
            z-index: 10;
            padding: 0 80px;
        }
        
        /* Logo */
        .logo-container {
            flex-shrink: 0;
        }
        
        .logo {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #00D26A 0%, #00a854 100%);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 210, 106, 0.3);
        }
        
        .logo svg {
            width: 100px;
            height: 100px;
        }
        
        /* Text */
        .text-content {
            color: white;
        }
        
        .app-name {
            font-size: 72px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -2px;
        }
        
        .app-name span {
            color: #00D26A;
        }
        
        .tagline {
            font-size: 28px;
            color: #888;
            margin: 10px 0 0 0;
            font-weight: 400;
        }
        
        /* Features strip */
        .features-strip {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 40px;
            z-index: 10;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 16px;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            background: rgba(0, 210, 106, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00D26A;
            font-size: 12px;
        }
        
        /* Download button */
        .download-btn {
            background: #00D26A;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .download-btn:hover {
            background: #00b85c;
        }
        
        .instructions {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Feature Graphic Generator</h1>
        <p>Imagen 1024x500 para Google Play Store</p>
        
        <div id="featureGraphic">
            <!-- Glows -->
            <div class="glow-circle glow-1"></div>
            <div class="glow-circle glow-2"></div>
            
            <!-- Main content -->
            <div class="content">
                <div class="logo-container">
                    <div class="logo">
                        <svg viewBox="0 0 100 100" fill="none">
                            <!-- Chat bubble -->
                            <path d="M20 25C20 19.477 24.477 15 30 15H70C75.523 15 80 19.477 80 25V55C80 60.523 75.523 65 70 65H45L30 80V65H30C24.477 65 20 60.523 20 55V25Z" fill="white"/>
                            <!-- Lock icon -->
                            <rect x="42" y="35" width="16" height="14" rx="2" fill="#00D26A"/>
                            <path d="M45 35V31C45 27.134 48.134 24 52 24H48C51.866 24 55 27.134 55 31V35" stroke="#00D26A" stroke-width="3" stroke-linecap="round"/>
                            <circle cx="50" cy="42" r="2" fill="white"/>
                            <rect x="49" y="43" width="2" height="4" fill="white"/>
                        </svg>
                    </div>
                </div>
                
                <div class="text-content">
                    <h1 class="app-name">Chat<span>P2P</span></h1>
                    <p class="tagline">Privacidad sin compromisos</p>
                </div>
            </div>
            
            <!-- Features strip -->
            <div class="features-strip">
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <span>Encriptación E2E</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📵</div>
                    <span>Sin capturas</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🚫</div>
                    <span>Sin número</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🗑️</div>
                    <span>Control compartido</span>
                </div>
            </div>
        </div>
        
        <button class="download-btn" onclick="downloadImage()">Descargar PNG 1024x500</button>
        <p class="instructions">Click para descargar. Sube este archivo como "Feature Graphic" en Google Play Console.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        async function downloadImage() {
            const element = document.getElementById('featureGraphic');
            
            const canvas = await html2canvas(element, {
                width: 1024,
                height: 500,
                scale: 1,
                backgroundColor: '#0a0a0a',
                useCORS: true
            });
            
            const link = document.createElement('a');
            link.download = 'chatp2p-feature-graphic.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
