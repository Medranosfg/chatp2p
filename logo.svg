<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
  </defs>
  
  <!-- Teléfono izquierdo -->
  <rect x="40" y="80" width="70" height="140" rx="8" fill="none" stroke="url(#greenGrad)" stroke-width="3"/>
  <rect x="48" y="95" width="54" height="110" rx="4" fill="url(#greenGrad)" opacity="0.2"/>
  <circle cx="75" cy="220" r="3" fill="url(#greenGrad)"/>
  
  <!-- Signo de igual -->
  <line x1="130" y1="135" x2="170" y2="135" stroke="url(#greenGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="165" x2="170" y2="165" stroke="url(#greenGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Teléfono derecho -->
  <rect x="190" y="80" width="70" height="140" rx="8" fill="none" stroke="url(#greenGrad)" stroke-width="3"/>
  <rect x="198" y="95" width="54" height="110" rx="4" fill="url(#greenGrad)" opacity="0.2"/>
  <circle cx="225" cy="220" r="3" fill="url(#greenGrad)"/>
</svg>
